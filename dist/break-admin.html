<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Administración · Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Break · panel del local: pensado para el celular del dueño, con vista previa al lado en pantallas grandes. */
:root{
  --paper:#EEF0EC;--sheet:#FFFFFF;--ink:#14161B;--ink2:#565D6A;--rule:#D7DAD4;--rule2:#E8EAE6;
  --carbon:#2840D0;--carbon-ink:#FFFFFF;--carbon-soft:#E5E9FE;
  --ok:#1B7F45;--ok-soft:#DFF2E6;--warn:#8F5600;--warn-soft:#FAEDD4;--bad:#B83226;--bad-soft:#FAE3DF;
  --shadow:0 1px 2px rgba(20,22,27,.06),0 8px 28px rgba(20,22,27,.08);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1014;--sheet:#171A20;--ink:#ECEEF2;--ink2:#9DA4B1;--rule:#2C313A;--rule2:#22262D;
  --carbon:#8FA2FF;--carbon-ink:#0B1030;--carbon-soft:#1E2548;
  --ok:#4CC383;--ok-soft:#13301F;--warn:#E7B24E;--warn-soft:#33270F;--bad:#FF8273;--bad-soft:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.4);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--sheet);border:1.5px solid var(--rule);color:var(--ink);text-align:center}
.btn.pri{background:var(--carbon);border-color:var(--carbon);color:var(--carbon-ink)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--rule))}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.lab{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--ink2)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--rule);background:var(--sheet);font-size:16px}
textarea.in{min-height:88px;resize:vertical}
.in:focus{border-color:var(--carbon);outline:none;box-shadow:0 0 0 3px var(--carbon-soft)}
.fld{margin:0 0 16px}
.help{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.en b{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--carbon-soft);color:var(--carbon);margin-left:4px}

/* Interruptor */
.sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;font-weight:600;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;margin:0;border-radius:99px;background:var(--rule);position:relative;transition:background .15s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--carbon)}
.sw input.soldsw:checked{background:var(--bad)}
.sw input:checked::after{transform:translateX(18px)}

/* Etiquetas como botones */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--rule);font-size:14px;font-weight:600;background:var(--sheet)}
.chip[aria-pressed="true"]{background:var(--carbon);border-color:var(--carbon);color:var(--carbon-ink)}

/* Encabezado */
.pn-top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);padding:env(safe-area-inset-top,0px) 0 0}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:58px}
.top-n{flex:1;min-width:0}
.top-n b{display:block;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-n small{display:block;font-size:12px;color:var(--ink2)}
.wm{font-weight:800;letter-spacing:-.02em;font-size:15px}
.wm i{font-style:normal;color:var(--carbon)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 12px;min-height:44px;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:2.5px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--carbon)}

/* Contenido */
.pn-main{display:block}
.pn-ed{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.intro{margin:0 0 16px;color:var(--ink2);font-size:14px}
.search{margin:0 0 14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow)}
.cat{margin:0 0 14px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;min-height:56px}
.cat-tg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:800;font-size:16px}
.cat-tg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tg small{flex:none;font-weight:600;font-size:12px;color:var(--ink2)}
.cat-tg::before{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s}
.cat.open .cat-tg::before{transform:rotate(45deg)}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--ink2);font-size:18px}
.ib:hover{background:var(--rule2)}
.ib[disabled]{opacity:.3}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.items{border-top:1px solid var(--rule2)}
.it{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--rule2)}
.it:last-child{border-bottom:0}
.it-m{flex:1;min-width:0;display:grid;gap:1px;padding:6px 0;min-height:48px;align-content:center}
.it-m b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-m span{font-size:14px;color:var(--ink2)}
.it-m em{font-style:normal;font-size:12px;font-weight:700}
.it.sold .it-m em{color:var(--bad)}
.it.off .it-m b{color:var(--ink2)}
.it.off .it-m em{color:var(--ink2)}
.it .sw{font-size:12px;gap:6px;flex-direction:column;align-items:center;min-height:0;color:var(--ink2)}
.add-row{display:flex;gap:8px;padding:10px 14px 14px}
.empty{padding:22px 16px;text-align:center;color:var(--ink2)}

/* Promos, menú del día, aviso, horario y festivos */
.sec-t{margin:26px 0 8px;font-size:18px;font-weight:800}
.sec-t:first-child,.note+.sec-t{margin-top:4px}
.blk{margin:0 0 14px;overflow:hidden}
.blk-t{flex:1;min-width:0;padding:6px 0}
.blk-t b{display:block;font-weight:800;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.blk-t small{display:block;font-size:13px;color:var(--ink2)}
.blk .it .ib{flex:none}
.none{margin:0 0 14px;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--rule);color:var(--ink2);font-size:14px}
.st{margin:0;padding:0 14px 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.st.ok{color:var(--ok)}
.st.warn{color:var(--warn)}
.cat-h+.st{padding-bottom:10px}
.help.pad{margin:0;padding:10px 14px 0}
.part{padding:10px 8px 10px 14px;border-bottom:1px solid var(--rule2)}
.part .lab{margin-bottom:4px;overflow-wrap:anywhere}
.part-r{display:flex;align-items:center;gap:6px}
.part-r .in{flex:1;min-width:0}
.avc{padding-top:14px}
.avc .cat-h{margin-top:-14px}
.av-x{margin:0 14px 10px;padding:10px 12px;border-radius:12px;background:var(--carbon-soft);font-weight:600;overflow-wrap:anywhere}
.av-x.av-suave{background:var(--rule2)}
.av-x.av-alerta{background:var(--warn-soft);color:var(--warn)}
.add-row{flex-wrap:wrap}
.hrs{padding:6px 14px 0}
.hr-r{display:grid;grid-template-columns:38px 44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:54px;border-bottom:1px solid var(--rule2)}
.hr-r:last-child{border-bottom:0}
.hr-r b{font-size:15px}
.hr-r.closed b{color:var(--ink2)}
.hr-r .in{min-height:42px;padding:6px 8px;font-variant-numeric:tabular-nums}
/* En la lista no cabe el ícono del reloj: al tocar la hora se abre igual el selector del celular. */
.hr-r .in::-webkit-calendar-picker-indicator{display:none}
.hr-x{grid-column:3/5;font-size:14px;color:var(--ink2)}
.past .it-m b{color:var(--ink2)}
.past .cat-h{flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .chip{padding:6px 0;font-size:13px;text-align:center}
.sheet .row2 .fld{min-width:0}

/* Barra de guardar */
.pn-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-st{flex:1 1 100%;min-width:0;margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.bar-in .btn.pri{flex:1 1 auto}
@media (min-width:600px){.bar-st{flex:1 1 140px;font-size:14px}.bar-in .btn.pri{flex:0 0 auto}}
@media (min-width:1100px){.pn-bar{padding-right:456px}}
.bar-st.dirty{color:var(--warn)}
.bar-st.ok{color:var(--ok)}
.bar-st.bad{color:var(--bad)}

/* Hoja de edición */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:20px 20px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;transform:translate(-50%,-50%);border-radius:20px;max-height:88vh}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;background:var(--sheet)}
.sheet-h h2{font-size:19px}
.sheet-f{display:flex;gap:10px;flex-wrap:wrap;padding-top:8px}
.sheet-f .btn{flex:1 1 140px}
.danger{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule2)}

/* Entrada */
.login{max-width:400px;margin:8vh auto 0;padding:28px 22px}
.login h1{font-size:24px;margin-bottom:6px}
.login p{margin:0 0 20px;color:var(--ink2)}
.pin{font-size:28px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.err{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:600}
.note{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}

/* Vista previa */
.pn-pv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--paper)}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.pv-dev{flex:1;min-height:0;display:flex;justify-content:center;padding:12px}
.pv-dev iframe{width:100%;max-width:420px;height:100%;border:1px solid var(--rule);border-radius:22px;background:#FFF;box-shadow:var(--shadow)}
@media (min-width:1100px){
  .pn-main{display:grid;grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .pn-ed{margin:0 auto;width:100%}
  .pn-pv[hidden]{display:flex!important}
  .pn-pv{position:sticky;top:110px;inset:auto;z-index:1;height:calc(100vh - 190px);background:none}
  .pv-bar{background:none;border:0;padding:4px 12px 0}
  .pv-bar .btn,.top-pv{display:none}
}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;transform:translateX(-50%) translateY(20px);max-width:min(92vw,460px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Agenda, galería, reseñas y fotos */
.it.old .it-m b{color:var(--ink2)}
.it.old .it-m em{color:var(--ink2)}
.it-m b.q{font-weight:600}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 14px 2px}
.gal-i{min-width:0}
.gal-m{display:block;width:100%;padding:0;text-align:left;border-radius:12px}
.gal-m img,.gal-e{display:grid;place-items:center;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--rule2)}
.gal-m img.op-t{object-position:top}
.gal-m img.op-b{object-position:bottom}
.gal-e{font-size:30px}
.gal-e.gal-t{padding:8px;font-size:13px;font-weight:600;color:var(--ink2);text-align:center}
.gal-c{display:block;margin-top:6px;font-size:13px;line-height:1.3;color:var(--ink2);overflow-wrap:anywhere}
.gal-mv{display:flex;justify-content:flex-end;gap:2px;margin-top:2px}
.ph{display:grid;gap:10px}
.ph-img{display:block;width:100%;max-height:260px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--rule2)}
.ph-img.op-t{object-position:top}
.ph-img.op-b{object-position:bottom}
.ph-none{margin:0;padding:20px 14px;border:1.5px dashed var(--rule);border-radius:12px;color:var(--ink2);font-size:14px;text-align:center}
.ph .err{margin:0}
.ph .st{padding:0}
.ph-b{display:flex;flex-wrap:wrap;gap:8px}
.ph .lab{margin:2px 0 -4px}

/* Break · administración del servidor del panel. Usa los estilos del panel (panel.css) y agrega estos. */
.ad{padding-bottom:64px}
.ad-c{margin:0 0 16px;padding:18px 16px}
.ad-c h2{font-size:19px;margin:0 0 4px}
.ad-c>.help:first-of-type{margin:0 0 14px}
.ad-list{list-style:none;margin:6px 0 0;padding:0}
.ad-row{padding:12px 0;border-top:1px solid var(--rule2)}
.ad-row:first-child{border-top:0}
.ad-n b{display:block;font-weight:800;overflow-wrap:anywhere}
.ad-n small{font-size:13px;color:var(--ink2)}
.ad-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ad-b a.btn{text-decoration:none}
.ad-pr{display:flex;gap:8px;align-items:center}
.ad-pr .in{flex:1;min-width:0}
.ad-pin{margin-top:12px;padding:12px;border-radius:12px;background:var(--paper)}
.ad-pin .ad-pr .in{background:var(--sheet)}
.ad-sum{display:grid;gap:2px;margin:0 0 12px;padding:12px;border-radius:12px;background:var(--paper)}
.ad-sum b{overflow-wrap:anywhere}
.ad-sum span{font-size:14px;color:var(--ink2)}
.ad-st{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.ad-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--rule))}
.ad-ok h2{color:var(--ok)}
.ad-link{margin:0 0 12px;font-weight:700;overflow-wrap:anywhere}
.ad-link a{color:var(--carbon)}
.ad-pinv{margin:0;font-size:28px;font-weight:800;line-height:1.2;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.ad .err{margin:0 0 12px}

</style>
</head>
<body>
<header class="pn-top" id="top"></header>
<main class="pn-ed ad" id="ed"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Break · administración del servidor del panel (/admin). Crea y actualiza locales con la app que descarga el estudio
   (.json), sube sus fotos a este servidor, cambia el PIN del dueño y descarga respaldos. La clave de administración
   (ADMIN_TOKEN) se escribe aquí y queda solo en esta pestaña (sessionStorage): nunca pasa por el estudio.
   No lleva el motor: solo habla con el servidor que la sirve. */
(function () {
  'use strict';
  const $ = function (s, el) { return (el || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  const attr = esc;
  const qs = new URLSearchParams(location.search);
  const K = 'break.admin', SLUG_RE = /^[a-z0-9-]{2,40}$/;
  /* Fotos que se suben al servidor; las ilustraciones SVG (diseño) se quedan en la app tal como vienen. */
  const PHOTO_RE = /^data:image\/(png|jpe?g|webp);base64,[a-z0-9+/=]+$/i;
  const A = { token: '', locales: [], file: null, fileErr: '', busy: false, result: null, pinFor: '' };

  function stGet() { try { return sessionStorage.getItem(K) || ''; } catch (e) { return ''; } }
  function stSet(v) { try { if (v) sessionStorage.setItem(K, v); else sessionStorage.removeItem(K); } catch (e) { /* sin almacenamiento */ } }
  let toastT = null;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 3200); }
  function walk(o, fn) {
    Object.keys(o).forEach(function (k) {
      const v = o[k];
      if (typeof v === 'string') { const r = fn(v); if (r !== undefined) o[k] = r; } else if (v && typeof v === 'object') walk(v, fn);
    });
  }
  function slugOf(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
  function panelLink(slug) { return location.origin + '/panel/' + slug; }
  function hoyISO() { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Bogota' }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
  /* PIN de 6 números al azar, sin los fáciles de adivinar (repetidos o seguidos). */
  function genPin() {
    const a = new Uint32Array(1); let p = '';
    do {
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else a[0] = Math.floor(Math.random() * 4294967296);
      p = String(a[0] % 1000000).padStart(6, '0');
    } while (/^(\d)\1{5}$/.test(p) || '0123456789'.indexOf(p) >= 0 || '9876543210'.indexOf(p) >= 0);
    return p;
  }
  function dataBlob(u) {
    const m = /^data:(image\/[\w.+-]+);base64,(.*)$/i.exec(u), bin = atob(m[2]), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: m[1].toLowerCase().replace('image/jpg', 'image/jpeg') });
  }

  async function api(method, path, body, raw) {
    const h = { Authorization: 'Bearer ' + A.token };
    let payload;
    if (raw) { payload = raw; h['Content-Type'] = raw.type || 'application/octet-stream'; } else if (body !== undefined) { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
    let res;
    try { res = await fetch(location.origin + path, { method: method, headers: h, body: payload, cache: 'no-store' }); } catch (e) { const err = new Error('No hay conexión con el servidor.'); err.status = 0; throw err; }
    let data = null; try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) { const err = new Error((data && data.error) || 'No se pudo completar. Intente de nuevo.'); err.status = res.status; throw err; }
    return data;
  }

  /* ---------- Entrada ---------- */
  function topBar(inside) {
    return '<div class="top-in"><div class="top-n"><b>Administración</b><small>Servidor del panel · Break</small></div>' +
      (inside ? '<button type="button" class="btn sm" data-a="logout">Salir</button>' : '') + '</div>';
  }
  function showLogin(msg) {
    A.token = ''; stSet('');
    $('#top').innerHTML = topBar(false);
    $('#ed').innerHTML = '<form class="login card" data-form="login" novalidate><h1>Administración</h1>' +
      '<p>Escriba la clave de administración de este servidor (ADMIN_TOKEN). Queda guardada solo mientras esta pestaña esté abierta.</p>' +
      '<label class="lab" for="tok">Clave de administración</label><input class="in" id="tok" name="tok" type="password" autocomplete="current-password">' +
      (msg ? '<p class="err" role="alert" style="margin-top:12px">' + esc(msg) + '</p>' : '') +
      '<button class="btn pri wide" type="submit" style="margin-top:16px">Entrar</button></form>';
    const t = $('#tok'); if (t) t.focus();
  }
  async function login(tok) {
    if (!tok) { showLogin('Escriba la clave.'); return; }
    A.token = tok;
    try { await loadList(); stSet(tok); render(); } catch (e) { showLogin(e.status === 401 ? 'Clave de administración incorrecta.' : e.message); }
  }
  async function loadList() { const r = await api('GET', '/api/admin/locales'); A.locales = (r && r.locales) || []; }
  function gone(e) { if (e.status === 401) { showLogin('La clave de administración ya no sirve. Escríbala de nuevo.'); return true; } return false; }

  /* ---------- Pantalla ---------- */
  function render() {
    $('#top').innerHTML = topBar(true);
    $('#ed').innerHTML = '<div id="res"></div><div id="up"></div><div id="list"></div>';
    renderResult(); renderForm(); renderList();
  }
  function exists(slug) { return A.locales.some(function (l) { return l.slug === slug; }); }
  function renderResult() {
    const r = A.result, box = $('#res'); if (!box) return;
    if (!r) { box.innerHTML = ''; return; }
    const link = panelLink(r.slug);
    box.innerHTML = '<section class="card ad-c ad-ok" role="status"><h2>' + (r.nuevo ? 'Local creado' : 'Local actualizado') + '</h2>' +
      '<p class="help">' + esc(r.name) + ' · versión ' + esc(r.v) + (r.fotos ? ' · ' + r.fotos + (r.fotos === 1 ? ' foto subida' : ' fotos subidas') : '') + (r.rep ? ' · contenido reemplazado' : '') + '</p>' +
      '<p class="lab" style="margin-top:12px">Enlace del panel para el dueño</p><p class="ad-link"><a href="' + attr(link) + '" target="_blank" rel="noopener">' + esc(link) + '</a></p>' +
      (r.pin ? '<p class="lab">PIN</p><p class="ad-pinv">' + esc(r.pin) + '</p><p class="help">Anótelo: no se vuelve a mostrar.</p>' : '') +
      '<div class="ad-b"><button type="button" class="btn pri sm" data-a="copy">Copiar enlace' + (r.pin ? ' y PIN' : '') + '</button><button type="button" class="btn sm" data-a="res-x">Listo</button></div>' +
      '<p class="help" style="margin-top:12px">Publique la app (.zip) que descargó del estudio con esta conexión: es la que lee este contenido.</p></section>';
  }
  function renderForm() {
    const box = $('#up'), f = A.file; if (!box) return;
    let h = '<section class="card ad-c" id="nuevo"><h2>Crear o actualizar un local</h2>' +
      '<p class="help">Suba la configuración .json que descarga el estudio en Publicar (o un respaldo de esta página). Sus fotos se suben a este servidor.</p>' +
      '<div class="fld"><button type="button" class="btn" data-a="pick">' + (f ? 'Elegir otro archivo' : 'Elegir el archivo .json') + '</button><input type="file" id="file" accept=".json,application/json" hidden></div>' +
      (A.fileErr ? '<p class="err" role="alert">' + esc(A.fileErr) + '</p>' : '');
    if (f) {
      const ex = exists(f.slug);
      h += '<div class="ad-sum"><b>' + esc(f.fname) + '</b><span>' + esc(f.title || 'App sin nombre') + ' · ' + f.items + (f.items === 1 ? ' plato' : ' platos') + ' · ' + f.photos.length + (f.photos.length === 1 ? ' foto por subir' : ' fotos por subir') + '</span></div>' +
        f.warn.map(function (w) { return '<p class="note">' + esc(w) + '</p>'; }).join('') +
        '<form data-form="up" novalidate>' +
        '<div class="fld"><label class="lab" for="slug">Nombre corto del local</label><input class="in" id="slug" name="slug" value="' + attr(f.slug) + '" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false">' +
        '<p class="help">Minúsculas, números y guiones. Va en el enlace: ' + esc(location.origin) + '/panel/…</p><p class="note" id="slug-w" hidden></p></div>' +
        '<div class="fld"><label class="lab" for="name">Nombre del local</label><input class="in" id="name" name="name" value="' + attr(f.title) + '" maxlength="80"></div>' +
        '<div class="fld"><label class="lab" for="pin">PIN del dueño</label><div class="ad-pr"><input class="in" id="pin" name="pin" inputmode="numeric" maxlength="6" autocomplete="off"><button type="button" class="btn sm" data-a="gen" data-t="pin">Generar uno</button></div>' +
        '<p class="help" id="pin-h">' + (ex ? 'Este local ya existe: déjelo vacío para no cambiar el PIN.' : '6 números. El dueño lo usa para entrar a su panel.') + '</p></div>' +
        '<div class="fld" id="rep-box"' + (ex ? '' : ' hidden') + '><label class="sw"><input type="checkbox" name="rep">Reemplazar también el contenido (carta, promos, avisos…)</label>' +
        '<p class="help">Se pierden los cambios que hizo el dueño. Sin marcar, solo se actualiza el diseño y la carta del dueño queda igual.</p></div>' +
        '<p class="ad-st" id="prog" role="status" hidden></p><p class="err" id="ferr" role="alert" hidden></p>' +
        '<button type="submit" class="btn pri wide" id="go">' + (ex ? 'Actualizar el local' : 'Crear el local') + '</button></form>';
    }
    box.innerHTML = h + '</section>';
    slugState();
  }
  function renderList() {
    const box = $('#list'); if (!box) return;
    const L = A.locales;
    box.innerHTML = '<section class="card ad-c"><h2>Locales</h2><p class="help">' + (L.length ? L.length + (L.length === 1 ? ' local en este servidor.' : ' locales en este servidor.') : 'Todavía no hay locales en este servidor.') + '</p>' +
      (L.length ? '<ul class="ad-list">' + L.map(function (l) {
        return '<li class="ad-row"><div class="ad-n"><b>' + esc(l.name) + '</b><small>' + esc(l.slug) + '</small></div><div class="ad-b">' +
          '<a class="btn sm" href="' + attr(panelLink(l.slug)) + '" target="_blank" rel="noopener">Abrir panel</a>' +
          '<button type="button" class="btn sm" data-a="backup" data-s="' + attr(l.slug) + '">Descargar respaldo</button>' +
          '<button type="button" class="btn sm" data-a="pin" data-s="' + attr(l.slug) + '">Cambiar PIN</button></div>' +
          (A.pinFor === l.slug ? '<form class="ad-pin" data-form="pin" data-s="' + attr(l.slug) + '" novalidate><label class="lab" for="np">PIN nuevo</label>' +
            '<div class="ad-pr"><input class="in" id="np" name="np" inputmode="numeric" maxlength="6" autocomplete="off"><button type="button" class="btn sm" data-a="gen" data-t="np">Generar</button></div>' +
            '<p class="help">Al cambiarlo se cierran las sesiones abiertas del panel de este local.</p>' +
            '<div class="ad-b"><button type="submit" class="btn pri sm">Guardar PIN</button><button type="button" class="btn sm" data-a="pin-x">Cancelar</button></div></form>' : '') + '</li>';
      }).join('') + '</ul>' : '') + '</section>';
  }
  /* Al cambiar el nombre corto: ¿ya existe? ¿coincide con el de la app? */
  function slugState() {
    const f = A.file, el = $('#slug'); if (!f || !el) return;
    const s = el.value.trim(), ex = exists(s), w = $('#slug-w');
    $('#rep-box').hidden = !ex;
    $('#pin-h').textContent = ex ? 'Este local ya existe: déjelo vacío para no cambiar el PIN.' : '6 números. El dueño lo usa para entrar a su panel.';
    $('#go').textContent = ex ? 'Actualizar el local' : 'Crear el local';
    const off = f.appSlug && s !== f.appSlug;
    w.hidden = !off;
    w.textContent = off ? 'La app publicada pide el contenido de «' + f.appSlug + '»: con otro nombre corto no lo va a leer.' : '';
  }

  /* ---------- Archivo de la app ---------- */
  function validApp(a) { return !!(a && typeof a === 'object' && a.brand && typeof a.brand === 'object' && a.menu && Array.isArray(a.menu.categories) && Array.isArray(a.modules)); }
  function describe(app, fname) {
    const p = (app.meta && app.meta.panel) || {}, want = String(qs.get('local') || '').trim();
    const appSlug = SLUG_RE.test(String(p.slug || '')) ? p.slug : '';
    const photos = {}; let gifs = 0;
    walk(app, function (v) { if (PHOTO_RE.test(v)) photos[v] = true; else if (/^data:image\/gif/i.test(v)) gifs++; });
    const items = app.menu.categories.reduce(function (n, c) { return n + ((c && Array.isArray(c.items)) ? c.items.length : 0); }, 0);
    const api = String(p.api || '').trim().replace(/\/+$/, ''), warn = [];
    if (!appSlug || !api) warn.push('Esta app todavía no está conectada al panel, así que la app publicada no leerá este contenido. En el estudio, en Publicar › Panel del local, escriba ' + location.origin + ' y un nombre corto, y vuelva a descargar el .zip y el .json.');
    else if (api !== location.origin) warn.push('La app pide su contenido a ' + api + ', no a esta dirección (' + location.origin + '). Si es otra dirección de este mismo servidor, como un dominio propio, está bien.');
    if (gifs) warn.push(gifs === 1 ? 'Una imagen GIF no se puede subir: queda en la app solo si es parte del diseño.' : gifs + ' imágenes GIF no se pueden subir: quedan en la app solo si son parte del diseño.');
    return { app: app, fname: fname, appSlug: appSlug, slug: appSlug || (SLUG_RE.test(want) ? want : slugOf(app.brand.name)), title: String(app.brand.name || '').slice(0, 80), items: items, photos: Object.keys(photos), warn: warn };
  }
  function readFile(file) {
    const rd = new FileReader();
    rd.onload = function () {
      let data = null; try { data = JSON.parse(rd.result); } catch (e) { data = null; }
      const app = data && data.app && typeof data.app === 'object' ? data.app : data;
      A.result = null;
      if (!validApp(app)) { A.file = null; A.fileErr = 'Ese archivo no es una app de Break. Descárguela en el estudio, en Publicar › Configuración .json.'; }
      else { A.fileErr = ''; A.file = describe(app, file.name || 'app.json'); }
      renderResult(); renderForm();
    };
    rd.onerror = function () { A.fileErr = 'No se pudo leer el archivo.'; renderForm(); };
    rd.readAsText(file);
  }
  function prog(t) { const el = $('#prog'); if (el) { el.textContent = t || ''; el.hidden = !t; } }
  function ferr(t) { const el = $('#ferr'); if (el) { el.textContent = t || ''; el.hidden = !t; } }

  /* Sube las fotos (cada una una sola vez), las cambia por su dirección en este servidor y guarda el local. */
  async function upload(form) {
    const f = A.file; if (!f || A.busy) return;
    const slug = form.querySelector('[name="slug"]').value.trim(), name = form.querySelector('[name="name"]').value.trim();
    const pin = form.querySelector('[name="pin"]').value.trim(), ex = exists(slug), rep = !!(form.querySelector('[name="rep"]') || {}).checked;
    ferr('');
    if (!SLUG_RE.test(slug)) { ferr('El nombre corto lleva de 2 a 40 letras minúsculas, números o guiones.'); return; }
    if (pin && !/^\d{6}$/.test(pin)) { ferr('El PIN tiene 6 números.'); return; }
    if (!ex && !pin) { ferr('Escriba el PIN del dueño o toque «Generar uno».'); return; }
    A.busy = true; $('#go').disabled = true;
    const app = JSON.parse(JSON.stringify(f.app)), map = {};
    let done = 0;
    try {
      for (const u of f.photos) {
        prog('Subiendo fotos: ' + (done + 1) + ' de ' + f.photos.length + '…');
        const r = await api('POST', '/api/admin/locales/' + slug + '/fotos', undefined, dataBlob(u));
        if (!r || !/^https?:\/\/\S+$/.test(r.url || '')) throw new Error('El servidor no devolvió la dirección de la foto.');
        map[u] = r.url; done++;
      }
      walk(app, function (v) { return map[v]; });
      prog('Guardando el local…');
      const body = { name: name || slug, app: app };
      if (pin) body.pin = pin;
      if (ex && rep) body.reemplazar = true;
      const r = await api('PUT', '/api/admin/locales/' + slug, body);
      A.result = { slug: slug, name: r.name || name || slug, v: r.v, pin: pin, nuevo: !ex, fotos: f.photos.length, rep: ex && rep };
      A.file = null; A.busy = false;
      try { await loadList(); } catch (e) { /* la lista se actualiza al volver a entrar */ }
      render();
      try { window.scrollTo(0, 0); } catch (e) { /* sin desplazamiento */ }
    } catch (e) {
      A.busy = false; prog('');
      if (gone(e)) return;
      $('#go').disabled = false;
      ferr((done < f.photos.length ? 'No se pudo subir la foto ' + (done + 1) + ' de ' + f.photos.length + ': ' : 'No se pudo guardar el local: ') + e.message + ' No se guardó nada del local.');
    }
  }
  async function backup(slug) {
    try {
      const data = await api('GET', '/api/admin/locales/' + slug);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      a.download = slug + '-respaldo-' + hoyISO() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) { /* nada */ } a.remove(); }, 1500);
      toast('Respaldo descargado. Se puede importar en el estudio.');
    } catch (e) { if (!gone(e)) toast(e.message); }
  }
  async function savePin(form) {
    const slug = form.getAttribute('data-s'), pin = form.querySelector('[name="np"]').value.trim();
    if (!/^\d{6}$/.test(pin)) { toast('El PIN tiene 6 números.'); return; }
    try {
      await api('PUT', '/api/admin/locales/' + slug, { pin: pin });
      A.pinFor = ''; renderList();
      toast('PIN cambiado. Las sesiones abiertas de ese panel se cerraron.');
    } catch (e) { if (!gone(e)) toast(e.message); }
  }
  async function copy() {
    const r = A.result; if (!r) return;
    const text = 'Panel de ' + r.name + ': ' + panelLink(r.slug) + (r.pin ? '\nPIN: ' + r.pin : '');
    try { await navigator.clipboard.writeText(text); toast('Copiado.'); } catch (e) { toast('No se pudo copiar: cópielo a mano.'); }
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    switch (b.getAttribute('data-a')) {
      case 'logout': A.file = null; A.result = null; showLogin(); break;
      case 'pick': { const i = $('#file'); if (i) i.click(); break; }
      case 'gen': { const i = document.getElementById(b.getAttribute('data-t')); if (i) i.value = genPin(); break; }
      case 'backup': backup(b.getAttribute('data-s')); break;
      case 'pin': A.pinFor = b.getAttribute('data-s'); renderList(); { const i = $('#np'); if (i) i.focus(); } break;
      case 'pin-x': A.pinFor = ''; renderList(); break;
      case 'copy': copy(); break;
      case 'res-x': A.result = null; renderResult(); break;
    }
  });
  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.id === 'file') { const f = t.files && t.files[0]; try { t.value = ''; } catch (err) { /* sin limpiar */ } if (f) readFile(f); }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'slug') slugState(); });
  document.addEventListener('submit', function (e) {
    const f = e.target, kind = f.getAttribute('data-form'); if (!kind) return;
    e.preventDefault();
    if (kind === 'login') { const t = f.querySelector('[name="tok"]'); login(String((t && t.value) || '').trim()); }
    if (kind === 'up') upload(f);
    if (kind === 'pin') savePin(f);
  });

  /* ---------- Arranque ---------- */
  const saved = stGet();
  if (saved) login(saved); else showLogin();
  window.__breakAdmin = { A: A, genPin: genPin };
})();

</script>
</body>
</html>
